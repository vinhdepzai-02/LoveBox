<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hộp Tình Iuu Vinh & Hoaa</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --pink: #ff4d6d; --blue: #00b4d8; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; background: #fff; }
        #user-select { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; }
        .select-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; cursor: pointer; font-weight: bold; transition: 0.3s; text-align: center; padding: 20px; }
        .btn-hoaa { background: var(--pink); }
        .btn-vinh { background: var(--blue); }
        #pass-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; color: white; flex-direction: column; align-items: center; justify-content: center; }
        input { font-size: 2rem; width: 160px; text-align: center; border-radius: 15px; border: none; padding: 10px; margin: 20px; outline: none; }
        #app { display: none; height: 100vh; flex-direction: column; }
        @media (min-width: 768px) { #app { flex-direction: row; } }
        .side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative; }
        .side-hoaa { background: var(--pink); border-bottom: 5px solid white; }
        .side-vinh { background: var(--blue); }
        @media (min-width: 768px) { .side-hoaa { border-bottom: none; border-right: 5px solid white; } }
        .heart { font-size: 100px; cursor: pointer; transition: 0.2s; user-select: none; }
        .heart:active { transform: scale(1.3); }
        .heart.disabled { opacity: 0.3; pointer-events: none; }
        .counter { background: rgba(255,255,255,0.2); padding: 15px 40px; border-radius: 30px; margin-top: 20px; text-align: center; }
        .count-val { font-size: 4rem; font-weight: bold; display: block; }
        #noti { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: white; color: #333; padding: 15px 30px; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: none; z-index: 500; font-weight: bold; border: 2px solid var(--pink); }
        .wait-text { font-size: 14px; margin-top: 10px; height: 20px; opacity: 0; transition: 0.3s; color: #fff; font-weight: bold; }
        .show-wait { opacity: 1; }
    </style>
</head>
<body>
    <div id="noti"></div>
    <div id="user-select">
        <div class="select-btn btn-hoaa" onclick="openPass('hoaa')">Bạn là "ơn vẹm" 💗</div>
        <div class="select-btn btn-vinh" onclick="openPass('vinh')">Bạn là "ông chành" 💞</div>
    </div>
    <div id="pass-screen">
        <h2>Mã số tình iuu</h2>
        <input type="password" id="pw-input" inputmode="numeric" maxlength="4" placeholder="****">
        <button onclick="checkPass()" style="padding: 10px 40px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; background: white; color: black;">XÁC NHẬN</button>
    </div>
    <div id="app">
        <div class="side side-hoaa">
            <h1>ơn vẹm 💗</h1>
            <div class="heart" id="h-hoaa" onclick="hit('hoaa')">❤️</div>
            <div id="w-hoaa" class="wait-text">chờ 2s để gửi tiếp tình iuu nhaa💗</div>
            <div class="counter"><small>NHẬN TỪ ÔNG CHÀNH</small><span class="count-val" id="count-hoaa">0</span></div>
        </div>
        <div class="side side-vinh">
            <h1>ông chành 💞</h1>
            <div class="heart" id="h-vinh" onclick="hit('vinh')">💙</div>
            <div id="w-vinh" class="wait-text">chờ 2s để gửi tiếp tình iuu nhaa💗</div>
            <div class="counter"><small>NHẬN TỪ ƠN VẸM</small><span class="count-val" id="count-vinh">0</span></div>
        </div>
    </div>
    <script>
        const config = {
            apiKey: "AIzaSyC-DasZWS4fJ6Ek8qAjwHLMlFz3gjaYKhI",
            authDomain: "vinhhoalovebox-f2dbc.firebaseapp.com",
            databaseURL: "https://vinhhoalovebox-f2dbc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vinhhoalovebox-f2dbc",
            appId: "1:11956164266:web:3be3ea1f5bf28635e022d3"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        const path = 'love_box/' + new Date().toISOString().split('T')[0];
        let me = ""; 
        function openPass(u) { me = u; document.getElementById('pass-screen').style.display = 'flex'; }
        function checkPass() {
            const val = document.getElementById('pw-input').value;
            const correct = (me === 'hoaa' ? "1202" : "1002");
            if(val === correct) {
                document.getElementById('user-select').style.display = 'none';
                document.getElementById('pass-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                init();
            } else { alert("Sai mã rồi nà!"); }
        }
        function init() {
            db.ref(path).on('value', s => {
                const d = s.val() || { h: 0, v: 0 };
                document.getElementById('count-hoaa').innerText = d.h || 0;
                document.getElementById('count-vinh').innerText = d.v || 0;
                if(d.msg && d.sender !== me) {
                    const n = document.getElementById('noti');
                    n.innerText = d.msg; n.style.display = 'block';
                    setTimeout(() => n.style.display = 'none', 3000);
                    db.ref(path + '/msg').set("");
                }
            });
        }
        function hit(u) {
            if(u !== me) return;
            const h = document.getElementById('h-' + u);
            const w = document.getElementById('w-' + u);
            h.classList.add('disabled');
            w.classList.add('show-wait');
            db.ref(path).once('value').then(s => {
                const d = s.val() || { h: 0, v: 0 };
                const up = { sender: me };
                if(u === 'hoaa') { up.v = (d.v || 0) + 1; up.msg = "ơn vẹm iuu nhớ chồng 💗"; }
                else { up.h = (d.h || 0) + 1; up.msg = "ông chành iuu nhớ vợ 💞"; }
                db.ref(path).update(up);
            });
            setTimeout(() => { h.classList.remove('disabled'); w.classList.remove('show-wait'); }, 2000);
        }
    </script>
</body>
</html>
