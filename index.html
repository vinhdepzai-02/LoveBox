<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hộp Tình Iuu Vinh & Hoaa</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ff4d6d; --blue: #00b4d8; --bg: #fdf0f2; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; background: #fff; }
        
        /* Màn hình chọn User */
        #user-select { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; }
        .select-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-hoaa { background: var(--pink); }
        .btn-vinh { background: var(--blue); }

        /* Màn hình Password */
        #pass-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; color: white; flex-direction: column; align-items: center; justify-content: center; }
        input[type="password"] { font-size: 2rem; width: 160px; text-align: center; border-radius: 15px; border: none; padding: 10px; margin: 20px; outline: none; }
        
        /* Giao diện chính */
        #app { display: none; height: 100vh; flex-direction: column; position: relative; }
        @media (min-width: 768px) { #app { flex-direction: row; } }
        
        /* Thanh công cụ (Ngày tháng & Nút Nhật ký) */
        #controls { position: absolute; top: 10px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 50; }
        #date-picker { padding: 8px; border-radius: 20px; border: 2px solid #ddd; font-weight: bold; color: #555; outline: none; }
        #diary-btn { padding: 8px 15px; border-radius: 20px; border: none; background: #ff9a9e; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative; transition: 0.3s; }
        .side-hoaa { background: var(--pink); border-bottom: 5px solid white; }
        .side-vinh { background: var(--blue); }
        @media (min-width: 768px) { .side-hoaa { border-bottom: none; border-right: 5px solid white; } }

        .heart { font-size: 90px; cursor: pointer; transition: 0.2s; user-select: none; margin-bottom: 10px; }
        .heart:active { transform: scale(1.3); }
        .heart.disabled { opacity: 0.5; transform: scale(0.9); pointer-events: none; }
        
        .counter { background: rgba(255,255,255,0.25); padding: 10px 30px; border-radius: 30px; text-align: center; min-width: 140px; }
        .count-val { font-size: 3.5rem; font-weight: bold; display: block; line-height: 1; }
        
        .wait-text { font-size: 14px; margin-top: 5px; height: 20px; opacity: 0; transition: 0.3s; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .show-wait { opacity: 1; }
        
        /* Modal Nhật Ký */
        #diary-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .diary-content { background: #fff5f8; width: 90%; max-width: 500px; height: 80%; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popUp 0.3s ease; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .diary-section { flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; }
        .diary-label { font-weight: bold; color: #555; margin-bottom: 5px; display: flex; justify-content: space-between; }
        textarea { flex: 1; border: 2px solid #eee; border-radius: 10px; padding: 10px; resize: none; font-family: 'Patrick Hand', cursive, sans-serif; font-size: 1.2rem; outline: none; background: white; }
        textarea:focus { border-color: var(--pink); }
        textarea[readonly] { background: #f9f9f9; color: #777; }
        
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .save-btn { background: var(--pink); color: white; padding: 10px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .close-btn { background: #ccc; color: white; padding: 10px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }

        /* Thông báo */
        #noti { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: white; color: #333; padding: 10px 20px; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; z-index: 500; font-weight: bold; border: 2px solid var(--pink); white-space: nowrap; }
    </style>
</head>
<body>

    <div id="noti"></div>

    <div id="user-select">
        <div class="select-btn btn-hoaa" onclick="openPass('hoaa')">Bạn là "ơn vẹm" 💗</div>
        <div class="select-btn btn-vinh" onclick="openPass('vinh')">Bạn là "ông chành" 💞</div>
    </div>

    <div id="pass-screen">
        <h2>Mật khẩu
